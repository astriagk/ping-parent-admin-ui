<!-- header start -->
<app-header-four></app-header-four>
<!-- header end -->

<main>
  <!-- login Area start -->
  <section class="login-area pt-100 pb-100">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 offset-lg-2">
          <div class="basic-login">
            <h3 class="text-center mb-60">Login From Here</h3>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-20">
                <label for="email">Email Address <span>**</span></label>
                <input
                  id="email"
                  type="text"
                  placeholder="Email address..."
                  formControlName="email"
                />
                <ng-container
                  *ngIf="false; else emailErrorBlock"
                ></ng-container>
                <ng-template #emailErrorBlock>
                  <span
                    *ngIf="
                      getError('email') &&
                      (loginForm.get('email')?.touched || formSubmitted)
                    "
                    class="text-danger"
                    >{{ getError("email") }}</span
                  >
                </ng-template>
              </div>

              <div class="mb-20">
                <label for="pass">Password <span>**</span></label>
                <input
                  id="pass"
                  type="password"
                  placeholder="Enter password..."
                  formControlName="password"
                />
                <ng-container
                  *ngIf="false; else passwordErrorBlock"
                ></ng-container>
                <ng-template #passwordErrorBlock>
                  <span
                    *ngIf="
                      getError('password') &&
                      (loginForm.get('password')?.touched || formSubmitted)
                    "
                    class="text-danger"
                    >{{ getError("password") }}</span
                  >
                </ng-template>
              </div>

              <div class="login-action mb-20 fix">
                <span class="log-rem f-left">
                  <input id="remember" type="checkbox" />
                  <label for="remember">Remember me!</label>
                </span>
                <span class="forgot-login f-right">
                  <a href="#">Lost your password?</a>
                </span>
              </div>
              <button class="os-btn w-100" [disabled]="loading$ | async">
                <span *ngIf="loading$ | async; else loginText"
                  >Logging in...</span
                >
                <ng-template #loginText>Login Now</ng-template>
              </button>
              <div *ngIf="error$ | async as error" class="text-danger mb-2">
                {{ error.error || error.message }}
              </div>
              <div class="or-divide"><span>or</span></div>
              <a routerLink="/pages/register" class="os-btn os-btn-black w-100"
                >Register Now</a
              >
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- login Area End-->
</main>

<!-- footer start -->
<app-footer-one></app-footer-one>
<!-- footer end -->
